</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <img src="Settings icon.png" alt="Settings" class="icon">
            <img src="logo findmypaw.png" alt="FindMyPaw Logo" class="logo">

            <a href="notification.centre.html">Notification Centre</a>
            <a href="contactus.html">Contact Us</a>
        </nav>
    </header>

    <main class="missing-page">
        <section class="missing-panel">
            <div class="missing-title-row">
                <h1>Missing Pet</h1>
                <div class="missing-title-paws" aria-hidden="true">
                    <i class="fa-solid fa-paw"></i>
                    <i class="fa-solid fa-paw"></i>
                </div>
            </div>

            <form id="missingPetForm" class="missing-form-layout">
                <div class="missing-fields">
                    <div class="missing-field">
                        <label for="petName">Pet Name <span class="required-mark">*</span></label>
                        <input type="text" id="petName" name="petName" required>
                    </div>

                    <div class="missing-field">
                        <label for="animalType">Type of Animal <span class="required-mark">*</span></label>
                        <input type="text" id="animalType" name="animalType" required>
                    </div>

                    <div class="missing-field">
                        <label for="breed">Breed</label>
                        <input type="text" id="breed" name="breed">
                    </div>

                    <div class="missing-field">
                        <label for="chipNumber">Chip Number</label>
                        <input type="text" id="chipNumber" name="chipNumber">
                    </div>

                    <div class="missing-field">
                        <label for="lastSeen">Last seen location <span class="required-mark">*</span></label>
                        <input type="text" id="lastSeen" name="lastSeen" required>
                    </div>

                    <div class="missing-field">
                        <label for="contactNumber">Contact Number <span class="required-mark">*</span></label>
                        <input type="tel" id="contactNumber" name="contactNumber" required>
                    </div>
                </div>

                <div class="missing-photo-side">
                    <label class="photo-label" for="petPhoto">Insert Photo <span class="required-mark">*</span></label>

                    <div class="photo-upload-box">
                        <img id="photoPreview" src="puppy yellow bg.avif" alt="Preview of your pet photo">
                        <input type="file" id="petPhoto" name="petPhoto" accept="image/*" required>
                        <label for="petPhoto" class="photo-change-btn">
                            <i class="fa-solid fa-camera" aria-hidden="true"></i>
                            Upload photo
                        </label>
                    </div>

                    <button type="submit" class="missing-send-btn">Send</button>
                </div>
            </form>
        </section>
    </main>
</body>

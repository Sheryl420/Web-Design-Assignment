<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="nav-left">
            <img src="Settings icon.png" class="icon">
            <img src="logo findmypaw.png" class="logo" alt="FindMyPaw Logo">
        </div>
        
        <div class="nav-links">
            <a href="Homepage.html">Home</a>
            <a href="Aboutus.html">About Us</a>
            <a href="Adopt.html">Adopt Me</a>
            <a href="Apply-Here.html">Apply Here</a>
            <a href="Missing.html">Missing Pet</a>
            <a href="notification.centre.html">Notification Centre</a>
            <a href="contactus.html">Contact Us</a>
        </div>
    </div>
    <section class="account-container">
        
        <!-- LEFT IMAGE -->
        <div class="account-left">
            <img src="cat green bg.jpg" alt="cat">
        </div>
        
        <!-- RIGHT FORM -->
        <div class="account-right">
            <h2>Log In</h2>
            
            <form id="createForm">
                
                <label for="loginName">Name & Surname</label>
                <input id="loginName" type="text" placeholder="Name & Surname" required>
                
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" placeholder="Password" required>
                
                <button type="submit" class="next-btn">Next</button>
                
            </form>
            
            <div class="social-icons">
                <i class="bi bi-instagram"></i>
                <i class="bi bi-facebook"></i>
                <a href="mailto:sherylamanda13@gmail.com">
                    <i class="bi bi-envelope-fill"></i>
                </a>
            </div>
            
            <p class="login-link">
                <a href="Createacc.html">Create Account?</a>
            </p>
            
        </div>
        
    </section>
    
    <script src="script.js"></script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <img src="Settings icon.png" alt="Settings" class="icon">
            <img src="logo findmypaw.png" alt="FindMyPaw Logo" class="logo">
        </div>
        
        <nav class="nav-links">
            <a href="Homepage.html">Home</a>
            <a href="Aboutus.html">About Us</a>
            <a href="Adopt.html">Adopt Me</a>
            <a href="Apply-Here.html">Apply Here</a>
            <a href="Missing.html">Missing Pet</a>
            <a href="notification.centre.html">Notification Centre</a>
            <a href="contactus.html">Contact Us</a>
        </nav>
    </header>
</head>
</head>
<body>
    <!-- Volunteer Section -->
<section class="volunteer-section">

    <!-- Left Images -->
    <div class="side-images left-images">
        <img src="puppy yellow bg.avif" alt="Dog">
        <img src="polka dot dog purple bg.jpg" alt="Dog">
        <img src="puppy orange bg.avif" alt="Cats">
        <img src="cat cilest bg.avif" alt="Dog">
    </div>

    <!-- Volunteer Form -->
    <div class="volunteer-form-container">

        <h1>Volunteer Form</h1>
        <p class="subtitle">Volunteer & Event Application Requirements</p>

        <!-- Requirements -->
        <div class="requirements">

            <label>
                <input type="checkbox">
                Must be at least 16 years old (or have parental consent)
            </label>

            <label>
                <input type="checkbox">
                Have a genuine interest in animal care and welfare
            </label>

            <label>
                <input type="checkbox">
                Be available for scheduled shifts or event days
            </label>

            <label>
                <input type="checkbox">
                Able to work well in a team and follow instructions
            </label>

            <label>
                <input type="checkbox">
                Willing to handle responsibilities such as feeding, cleaning, or assisting visitors
            </label>

            <label>
                <input type="checkbox">
                Maintain a positive attitude and respectful behaviour at all times
            </label>

        </div>
        <!-- Form -->
        <form class="volunteer-form">

            <label> Name & Surname </label>
            <input type="text" required>

            <label> Mobile Number </label>
            <input type="tel" required>

            <label> Email Address </label>
            <input type="email" required>

            <label> Message </label>
            <textarea rows="5"></textarea>

            <button type="submit">Submit</button>
        </form>

    </div>
    <!-- Right Images -->
    <div class="side-images right-images">
        <img src="bananadog.avif" alt="Dog">
        <img src="Dog with green bg.jpg" alt="Dog">
        <img src="dog&cat yellow bg.jpg" alt="Pets">
        <img src="Bigdogyellow.jpg" alt="Cat">
    </div>
</section>
    <script src="script.js"></script>
</body>
</html>
